<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Layout Task</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
         .main{
              height: 500px;
              width: 300px;
              background:linear-gradient(to right,rgb(32, 218, 218),rgb(216, 28, 103));
              margin: 60px auto;
              display: flex;
              justify-content: center;
              align-items: center;
              color:black;
        }
        h1{
            display: flex;
            justify-content: center;
            font-size: 20px;
        }
        button{
            font-size: 25px;
            background-color: yellow;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius:6px;
            width: 250px;
            
        }
        .box{
            width: 250px;
            border-radius:6px;
        }
        img{
            height: 85px;
            width:80px;
            display: flex;
            margin-left: 80px;
        
      }
      /* #icon{
         height: 35px;
         width: 40px;
         display: flex;
         margin:0%; */

      /* } */
      #crossicon{
        height: 35px;
        width: 35px;
        /* display: flex; */
        margin-left: 210px;
        margin-bottom: 15px;

      }  
       
    </style>
</head>

<body>
    <div class="main" id="main">
        <form id="form">
            <!-- <img src="./threedoticon.png" alt="" id="icon"> -->
            <img src="./x-mark.png" onclick="document.getElementById('main').style.display='none'" id="crossicon">

            <img src="./laborpng.png" alt="">
            <br>
            <h1>Form</h1>
            <br>
            <br>
            <label>Name*:</label>
            <br>
            <input type="text" required class="box" id="name">
            <br>    
            <label>Age*</label>
            <br>
            <input type="number" required class="box" id="age">
            <br>
            <label>Gender</label>
            <br>
            <input type="text" class="box" id="gender">
            <br>
            <!-- <label>Address Line 2</label>
            <br>
            <input type="text" class="box">
            <br>
            <label>City</label> -->
            <br>
            <br>
            <button>Submit</button>
        </form>
        <script>
            let Name = prompt("Name");
            document.getElementById("name").value=Name;
            let Age = prompt("Age");
            document.getElementById("age").value=Age;
            let Gender = prompt("Gender");
            document.getElementById("gender").value=Gender;

        </script>
    </div>

</body>
</html>

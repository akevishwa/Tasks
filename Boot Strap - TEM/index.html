<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-yEPZ7jP9S0QKiUQ0m3jjsO4ProIW7wvR9gXkI7JOGa2XVsw53Yke2bsdkBbjmmiX" crossorigin="anonymous">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/js/bootstrap.bundle.min.js" integrity="sha384-WyOxWvTyr1QaMPfiPJSv76iReVthorl5uWlFtZPyK0IEB0hGzo9y5Bp9mYanr8Bu" crossorigin="anonymous"></script>

    <title>BS-demo</title>






</head>






<body>
    




  <nav class="navbar navbar-expand-lg bg-danger"
     data-bs-theme="dark">

  <div class="container">

    <a class="navbar-brand" href="#">MrGenie</a>

    <div class="navbar-nav">
      <a class="nav-link active" href="#">Home</a>
      <a class="nav-link" href="#">About</a>
      <a class="nav-link" href="#">Courses</a>
      <a class="nav-link" href="#">Contact</a>
    </div>

  </div>
</nav> 





<div class="container mt-4">

    <button class="btn btn-primary"
            data-bs-toggle="modal"
            data-bs-target="#myModal">
        Open Modal
    </button>

</div>



<div class="modal" id="myModal">

    <div class="modal-dialog">

        <div class="modal-content">

            <div class="modal-header">
                <h5 class="modal-title">Welcome!</h5>
                <button class="btn-close"
                        data-bs-dismiss="modal"></button>
            </div>

            <div class="modal-body">
                Hello! This is my first Bootstrap Modal.
            </div>

            <div class="modal-footer">
                <button class="btn btn-secondary"
                        data-bs-dismiss="modal">
                    Close
                </button>
            </div>

        </div>

    </div>

</div>







<div class="container mt-4">

    <h2 class="text-center mb-3"> Sampleee Image Slider</h2>

    <div id="myCarousel" class="carousel slide">

        <div class="carousel-inner">

            <div class="carousel-item active">

                <img src="./images/car.jpg"
                     class="d-block w-100 ">

            </div>

            <div class="carousel-item">

                <img src="./images/moon.jpg"
                     class="d-block w-100">

            </div>

            <div class="carousel-item">

                <img src="./images/windows logo.jpg"
                     class="d-block w-100">

            </div>

        </div>


   

        <button class="carousel-control-prev"
                type="button"
                data-bs-target="#myCarousel"
                data-bs-slide="prev">

            <span class="carousel-control-prev-icon"></span>

        </button>




        <button class="carousel-control-next"
                type="button"
                data-bs-target="#myCarousel"
                data-bs-slide="next">

            <span class="carousel-control-next-icon"></span>

        </button>

    </div>

</div>



<div class="container mt-4">

    <h2 class="text-center mb-3">Frequently Asked Questions</h2>

    <div class="accordion" id="myAccordion">


        <div class="accordion-item">

            <h2 class="accordion-header">

                <button class="accordion-button"
                        data-bs-toggle="collapse"
                        data-bs-target="#answer1">

                    What is HTML?

                </button>

            </h2>

            <div id="answer1"
                 class="accordion-collapse collapse show"
                 data-bs-parent="#myAccordion">

                <div class="accordion-body">

                    HTML is used to create the structure of a webpage.

                </div>

            </div>

        </div>


        <div class="accordion-item">

            <h2 class="accordion-header">

                <button class="accordion-button collapsed"
                        data-bs-toggle="collapse"
                        data-bs-target="#answer2">

                    What is CSS?

                </button>

            </h2>

            <div id="answer2"
                 class="accordion-collapse collapse"
                 data-bs-parent="#myAccordion">

                <div class="accordion-body">

                    CSS is used to style a webpage.

                </div>

            </div>

        </div>



        <div class="accordion-item">

            <h2 class="accordion-header">

                <button class="accordion-button collapsed"
                        data-bs-toggle="collapse"
                        data-bs-target="#answer3">

                    What is JavaScript?

                </button>

            </h2>

            <div id="answer3"
                 class="accordion-collapse collapse"
                 data-bs-parent="#myAccordion">

                <div class="accordion-body">

                    JavaScript is used to add functionality to a webpage.

                </div>

            </div>

        </div>

    </div>

</div>










</body>
</html>

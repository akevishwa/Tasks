<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CHAHAM</title>
    <style>
        *{
            margin: 0px;
            padding:0px;
            box-sizing: border-box;
        }
        .main{
            width:100%;
            height:100vh;
            background-color: skyblue;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .inner{
            width:330px;
            height:400px;
            border-radius: 5px;
        }
        .head{
            width:100%;
            height:30%;
            background-color:deepskyblue;
            border-top-left-radius: 5px;
            border-top-right-radius:5px ;
        }
        .mid{
            width:100%;
            height:50%;
            background-color: whitesmoke;
            position: relative;
            
        }
        .foot{
            width:100%;
            height:20%;
            background-color: deepskyblue;
            border-top: 1px solid grey;
            border-bottom-left-radius: 5px;
            border-bottom-right-radius:5px ;
        }
        .image{
            width:120px;
            height: 120px;
            position: absolute;
            left:33%;
            top:-25%;
            border-radius: 50%;
            border: 5px solid whitesmoke;
        }
        .para1{
            position: absolute;
            top:100px;
            left:27%;
            font-size: 25px;
            letter-spacing:2px;

        }
        .para2{
            position: absolute;
            top:150px;
            left:35%;
            font-size:20px;
            letter-spacing:1px;
        }

    </style>
</head>
<body>
    <div class="main">
        <div class="inner">
            <div class="sub head"></div>
            <div class="sub mid">
                <img src="./GR-2.jpg" alt="" class = "image">
                <p class = "para1">George Russell</p>
                <p class = "para2">Great Britian</p>
            </div>
            <div class="sub foot"></div>
        </div>
    </div>
    
</body>
</html>

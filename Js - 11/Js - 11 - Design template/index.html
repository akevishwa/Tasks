<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>

        *{
            margin: 0px;
            padding: 0px;
            box-sizing: border-box;
        }

        .container{
            width: 90%;
            margin: 50px auto;
            display: flex;
            justify-content: space-between;
            gap: 20px;
            /* background-color: aqua; */
        }

        .imgcon{
            width: 30%;
            /* height: 100%; */
             /* background-color: blueviolet; */ 
        }

        .imgcon img{
            width: 100%;
            height: 400px;
            border-radius: 15px;
        }

        .cards{
            width: 70%;
            display: flex;
            justify-content: space-between;
            gap: 20px;
            align-items: center;
            background-color: black;
        }

        .card{
            width: 50%;
            height: 100%;
            background-color: rgba(245, 245, 245);
            border-radius: 8px;
            padding: 20px;
            
        }
        button{
            background-color: rgba(19, 59, 95);
            color: whitesmoke;
            font-size: 21px;
            padding: 8px;
            border-radius: 8px;
        }

        p
        {
            font-family: 'Times New Roman', Times, serif;
        }

        h3{
            color: rgba(19, 59, 95);
            font-weight: 600;
        }

        @media screen and (max-width: 930px)
        {
            .container{
                display: block;
            }

            .imgcon{
                width: 100%;
            }

            .imgcon img{
                height: auto;
            }

            .cards{
                width: 100%;
                display: flex;
            }

            .card{
                width: 50%;
            }
        }

        @media screen and (max-width: 600px)
        {
            .cards{
                flex-direction: column;
            }

            .card{
                width: 100%;
            }
        }

    </style>
</head>

<body>

    <div class="container">

        <div class="imgcon">
            <img src="./bglap.jpg" alt="" id="img1">
        </div>

        <div class="cards">

            <div class="card">
                <h3>Web Development</h3>
                <br>
                <p>
                    Learn HTML, CSS and JavaScript with practical projects
                    and responsive website development.
                </p><br>
                <button>Learn More</button>
            </div>

            <div class="card">
                <h3>Responsive Design</h3>
                <br>
                <p>
                    Create websites that automatically adjust their layout
                    according to desktop, tablet and mobile screens.
                </p>
                <br>
                <button>Explore</button>
            </div>

        </div>

    </div>

</body>
</html>

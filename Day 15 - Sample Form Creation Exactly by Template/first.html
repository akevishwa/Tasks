<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CHAHAM</title>
    <style>
        *{
            margin: 0px;
            padding:0px;
            box-sizing: border-box;
  
        }
        .main{
              height: 500px;
              width: 300px;
              background:linear-gradient(to right,goldenrod,chocolate);
              margin: 60px auto;
              display: flex;
              justify-content: center;
              align-items: center;
              color:black;
        }
        h1{
            display: flex;
            justify-content: center;
            font-size: 20px;
        }
        button{
            font-size: 25px;
            background-color: yellow;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius:6px;
            width: 250px;
            
        }
        .box{
            width: 250px;
            border-radius:6px;
        }
        img{
            height: 85px;
            width:80px;
            display: flex;
            margin-left: 80px;
        
      }
      #icon{
         height: 35px;
         width: 40px;
         display: flex;
         margin:0%;

      }
     

    </style>
</head>
<body>
    <div class="main">
        <form>
            <img src="./threedoticon.png" alt="" id="icon">
            <img src="./laborpng.png" alt="">
            <br>
            <h1>On-Site Enquiries Form</h1>
            <br>
            <br>
            <label>Name*:</label>
            <br>
            <input type="text" required class="box">
            <br>    
            <label>Where are you*</label>
            <br>
            <input type="text" required class="box">
            <br>
            <label>street address</label>
            <br>
            <input type="text" class="box">
            <br>
            <label>Address Line 2</label>
            <br>
            <input type="text" class="box">
            <br>
            <label>City</label>
            <br>
            <br>
            <br>
            <button>Submit</button>
        </form>
    </div>
    

</body>
</html>

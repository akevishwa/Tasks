<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0px;
            padding:0px;
            box-sizing: border-box;
           background-color: rgb(24, 239, 232);
        } 
        h1{
            background-color: midnightblue;
            color:white;
            padding: 70px;
        }
        footer{
            background-color:midnightblue;
            font-size: 30px;
            text-align: center;
            color:white;
            padding: 75px;
           /* margin-top: 350px;*/

        }
        table{
            border: 2px solid black;
            margin: 50px auto;
            margin-top: 100px;
        }
        table ,tr,th,td{
            border-collapse: collapse;
        }
        tr,td,th{
            border: 2px solid black;
            font-size: 35px;
            padding: 5px 10px;
            background-color: hotpink;
        }
        tr:nth-child(2) > td:nth-child(5){
            background-color: rgb(64, 255, 0);
        }
        td:hover{
            background-color: crimson;
        }
        

    </style>
</head>
<body>
    <h1>TABLE CREATION</h1>
     <table>
        <tr>
            <th>No</th>
            <td>1</td>
            <td>2</td>
            <td>3</td>
            <td>4</td>
        </tr>
        <tr>
            <th>Name</th>
            <td>Alex</td>
            <td>Lando</td>
            <td>Sarah</td>
            <td>Lewis</td>
   
         </tr>
         <tr>
            <th>Gender</th>
            <td>Male</td>
            <td>Male</td>
            <td>Female</td>
            <td>Male</td>
         </tr>
         <tr>
            <th>Age</th>
            <td>31</td>
            <td>27</td>
            <td>26</td>\
            <td>40</td>
         </tr>
        
     </table>
    <footer>SAMPLE DESIGN</footer>
</body>
</html>

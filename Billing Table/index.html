<!DOCTYPE html>
<html>
<head>
    <title>Simple Billing System</title>
    <link rel="stylesheet" href="style.css">




</head>


<body>









    <h1>Billing System</h1>

    <div class="con">

        <h2 id="h21">Add Product</h2>
<br>
<br>

        <input type="text" id="product" placeholder="PName">

        <input type="number" id="quantity" placeholder="Quantity">

        <input type="number" id="price" placeholder="Price">

        <button id="addBtn">Add Item</button>
<br>
<br>
<br>
        <h2 id="h22">Bill Details</h2>
<br>
<br>
        <table>

            
                <tr>
                    <th>Product</th>
                    <th>Quantity</th>
                    <th>Price</th>
                    <th>Total</th>
                    <th>Action</th>
                </tr>
            

            <tbody id="data">
            </tbody>
           

        </table>

              <br>


        <h3>Total Price: <span id="grandTotal">0 Rupees</span></h3>

 

    </div>

    <script src="app.js"></script>



</body>
</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 0px;
            padding: 0px;
            box-sizing: border-box;
            background-color: rgb(24, 239, 232);
        }

        header {
            background-color: crimson;
            padding: 25px;
            text-align: center;
            font-size: 28px;
            color: lawngreen;
            font-style: normal;
        }

        nav {
            background-color: gold;
            padding: 20px;
            text-align: center;
            font-size: 18px;
            color: rgb(29, 0, 250);
        }

        main {
            background-color: darkgrey;
            width: 100%;
            height: 72vh;
            display: flex;
        }

        .leftmain {
            width: 50%;
            height: 100%;
            background-color: beige;
        }

        .rightmain {
            width: 50%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: chocolate;
        }

        section {
            width: 100%;
            height: 50%;
            background-color: lavender;
        }

        article {
            width: 100%;
            height: 50%;
            background-color: lightpink;
        }

        aside {
            width: 65%;
            height: 80%;
            background-color: whitesmoke;

        }

        footer {
            background-color: crimson;
            padding: 20px;
            font-size: 25px;
            text-align: center;
            color: lawngreen;
        }
    </style>
</head>

<body>
    <header>Sample Header</header>
    <nav> Sample Navigation bar</nav>
    <main>
        <div class="leftmain">
            <section></section>
            <article>This is the Sample Article </article>
        </div>
        <div class="rightmain">
            <aside></aside>
        </div>
    </main>
    <footer>Sample Footer</footer>
</body>

</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="icon" href="./icon.jpg" type="img/x-icon">
    <title>CHAHAM</title>
    <style>
        *{
            margin: 0px;
            padding:0px;
            box-sizing: border-box;

        }
        nav{
            width: 100%;
            height: 10vh;
            background-color: brown;
            display: flex;
            justify-content: space-around;
        }

         span{
               width:50px;
               height:50px;
               display: flex;
               justify-content: center;
               align-items: center;
               display: none;
            }
        

        .logo{
            font-size: 25px;
            width: 300px;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: 700;
            color: gold;
            margin-left: 45px;

        }
        .ulists{
            width: 700px;
            height: 100%;
            padding: 5px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .li{
           list-style-type: none;
           margin-left: 25px;
           padding: 5px 15px;
        }
        .link{
             text-decoration: none;
             color:gold;
             font-size: 22px;
             position: relative;
        }
        .link::before{
            content: "";
            background-color:bisque;
            height: 4px;
            position: relative;
            display:inline-block;
            bottom: -35px;
            width: 0%;
            transition: all 0.5s linear 0s;
        }
        .link:hover::before{
            width: 100%;
        }
        @media screen and (max-width:850px) {
            nav{
                position: relative;
            }
            .ulists{
              position: absolute;
              top: 10vh;
              width: 100%;
              height: auto;
              display: block;
              left: -100%;
              background-color:darkslategrey;
              transition: all 0.5s linear 0s;
            }
            .li{
                    text-align: left;
            }
             span{
                    display: flex;
                    color: white;
                    font-size: 32px;
                 }
             .logo{
                    width:150px;
                    margin-left: 30px;
                    justify-content: start;
                 }

        }


    </style>
</head>
<body>
    <nav>
        <div class="logo">CHAHAM</div>
        <ul class="ulists" id="ulists">
            <li class="li"><a href="" class="link">HOME</a></li>
            <li class="li"><a href="" class="link">PRODUCTS</a></li>
            <li class="li"><a href="" class="link">SERVICES</a></li>
            <li class="li"><a href="" class="link">CONTACT</a></li>
        </ul>
 <span><i class="fa-solid fa-bars" onclick="toggle()"></i></span>
        <script>
               let toggled = false;

               function toggle(){
                     if (!toggled){
                        toggled = true;
                        document.getElementById("ulists").style.left = "0%";
                        return                         
                    }
                    if(toggled){
                        toggled = false;
                        document.getElementById("ulists").style.left = "-100%";
                        return
                     }
               }
        </script>

    </nav>
</body>
</html>
